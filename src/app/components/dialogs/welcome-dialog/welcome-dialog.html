<app-modal 
  [isVisible]="isVisible" 
  [title]="'Bienvenido a The Old & Only One'" 
  [closeOnBackdrop]="false"
  (onClose)="onContinue()">
  
  <div class="welcome-content">
    <div class="welcome-icon">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="32" fill="url(#welcomeGradient)"/>
        <path d="M32 16L40 32L32 48L24 32Z" fill="white"/>
        <defs>
          <linearGradient id="welcomeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#059669"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <p class="welcome-text">Prepárate para una experiencia de juego increíble en el universo de H.P. Lovecraft con tu navegador.</p>
    <p class="welcome-text">Cuida tu cordura...</p>
  </div>

  <div slot="footer">
    <button class="start-button" (click)="onContinue()">
      <span>Continuar</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</app-modal>
