<div class="game-container">
  <canvas #gameCanvas id="gameCanvas" class="game-canvas">
    Tu navegador no soporta el elemento canvas requerido para este juego.
  </canvas>
</div>

<!-- Velo de carga: mientras el motor compila shaders y forja el sistema, el diálogo de bienvenida
     ESPERA (petición del usuario: mejor un indicador que un botón visible pero muerto). -->
<div class="engine-loading" *ngIf="gameState === 'initializing'">
  <div class="engine-loading__ring"></div>
  <p class="engine-loading__title">Despertando el motor…</p>
  <p class="engine-loading__hint">compilando shaders y forjando el sistema</p>
</div>

<!-- Welcome dialog: aparece SOLO con el motor listo (ready/stopped) → responsive desde el primer frame -->
<app-welcome-dialog
  [isVisible]="(gameState === 'ready' || gameState === 'stopped') && !showControlsDialog"
  (continue)="onWelcomeContinue()">
</app-welcome-dialog>

<!-- Controls dialog: segundo diálogo con controles (aquí suena la música) -->
<app-controls-dialog
  [isVisible]="showControlsDialog"
  (start)="startGame()">
</app-controls-dialog>

<!-- Death dialog: appears when ship is destroyed -->
<app-death-dialog 
  *ngIf="showDeathDialog"
  (action)="handleDeathAction($event)">
</app-death-dialog>

<!-- Pause dialog: minimal content and continue button -->
<app-modal 
  [isVisible]="gameState === 'paused'" 
  [title]="'PAUSA'" 
  [closeOnBackdrop]="false"
  (onClose)="togglePause()">
  <div class="pause-content">
    <div class="welcome-icon">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="32" fill="url(#gameGradientPause)"/>
        <path d="M32 16L40 32L32 48L24 32Z" fill="white"/>
        <defs>
          <linearGradient id="gameGradientPause" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#667eea"/>
            <stop offset="100%" stop-color="#764ba2"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <p class="pause-text">El juego está en pausa.</p>
  </div>
  <div slot="footer">
    <button class="start-button" (click)="togglePause()">
      <span>Continuar</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</app-modal>

<!-- Landing panel shown after cinematic touchdown -->
<app-landing-panel
  [visible]="showLandingPanel"
  [context]="landingPanelContext"
  (takeoff)="onLandingTakeoff()"
  (stay)="onLandingStay()">
</app-landing-panel>

<!-- Station landing panel shown after docking to a space station port -->
<app-station-landing-panel
  [visible]="showStationPanel"
  [stationName]="stationName"
  [portName]="stationPortName"
  (takeoff)="onStationTakeoff()">
</app-station-landing-panel>
