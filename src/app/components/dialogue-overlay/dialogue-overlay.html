<div class="dialogue-overlay" *ngIf="visible && state as session">
  <div class="dialogue-frame">
    <header class="dialogue-header">
      <span class="race-name">{{ session.raceLabel }}</span>
      <span class="memory-readout">MEMORIA {{ memoryPercent }}%</span>
    </header>

    <div class="dialogue-log">
      <p
        *ngFor="let line of session.log; trackBy: trackByIndex"
        class="line"
        [class.line--narrator]="line.speaker === 'narrator'"
      >{{ line.text }}</p>
    </div>

    <p class="mission-summary" *ngIf="session.missionSummary">
      <span class="mission-tag">ENCARGO</span> {{ session.missionSummary }}
    </p>

    <div class="dialogue-choices">
      <button
        *ngFor="let choice of session.choices"
        type="button"
        class="choice"
        [class.choice--commit]="choice.kind === 'accept' || choice.kind === 'turn-in'"
        [class.choice--leave]="choice.kind === 'leave'"
        (click)="choose(choice)"
      >{{ choice.label }}</button>
    </div>
  </div>
</div>
